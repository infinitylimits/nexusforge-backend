spring.application.name=nexusforge-backend
server.port=8080
server.error.include-message=always

# real secrets live in application-local.properties (not committed to Git)
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/nexusforge?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=change_me

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=change-me-use-a-long-random-secret-of-at-least-32-characters
app.jwt.expiration-ms=86400000

logging.level.root=INFO
logging.level.com.nexusforge=DEBUG